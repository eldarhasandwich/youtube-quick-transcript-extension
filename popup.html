<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Transcript Copier settings</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Transcript Copier</h1><label><input id="metadata" type="checkbox" disabled> Include metadata</label>
<p>Prepend available video details when copying. Missing fields are omitted.</p>
<label><input id="show-thumbnails" type="checkbox" disabled> Show button on thumbnails</label>
<p>Add a transcript button to video thumbnails on YouTube pages. Off by default.</p>
<p id="status" role="status" aria-live="polite"></p><script src="popup.js"></script></body></html>
